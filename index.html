<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="icon" type="image/png" href="/logo-mark-192.png" />
    <link rel="apple-touch-icon" href="/logo-mark-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e11d2a" />
    <!-- Fetch the splash map during initial parse so the intro's reveal never
         paints late on a cold cache (it's cached for every visit after). -->
    <link rel="preload" as="image" href="/splash-map.jpg" fetchpriority="high" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bantay Basura" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Tingnan. I-report. Linisin. · I-report ang basura sa inyong lugar."
    />
    <title>Bantay Basura · Tingnan. I-report. Linisin.</title>

    <!-- Social / link-share preview (Facebook, Messenger, Twitter). og:image is
         an absolute URL; update the host to your custom domain at launch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bantay Basura" />
    <meta property="og:title" content="Bantay Basura · Tingnan. I-report. Linisin." />
    <meta
      property="og:description"
      content="Community waste reporting for the Philippines. Spot it, report it in under a minute — no account needed — and help your barangay clean up."
    />
    <meta property="og:image" content="https://bantay-basura-beta.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1800" />
    <meta property="og:image:height" content="945" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bantay Basura · Tingnan. I-report. Linisin." />
    <meta
      name="twitter:description"
      content="Community waste reporting for the Philippines. Spot it, report it, help your barangay clean up."
    />
    <meta name="twitter:image" content="https://bantay-basura-beta.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
